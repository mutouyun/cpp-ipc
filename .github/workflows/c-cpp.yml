name: C/C++ CI

on:
  push:
    branches: [ master, develop, issue-*, feature/* ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: cmake
      run: cmake -DCMAKE_BUILD_TYPE=Release -DLIBIPC_BUILD_TESTS=ON .
    - name: make
      run: make -j
    - name: test
      run: export LD_LIBRARY_PATH=./lib:$LD_LIBRARY_PATH && ./bin/test-ipc

  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: cmake
      run: cmake -S . -B build-windows -DLIBIPC_BUILD_TESTS=ON
    - name: build
      run: cmake --build build-windows --config Release --parallel
    - name: test
      run: .\build-windows\bin\Release\test-ipc.exe

  build-freebsd:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: build and test on FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        release: "15"
        prepare: pkg install -y cmake git
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DLIBIPC_BUILD_TESTS=ON .
          cmake --build .
          ./bin/test-ipc
